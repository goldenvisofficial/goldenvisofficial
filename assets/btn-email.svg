<svg xmlns="http://www.w3.org/2000/svg" width="240" height="60" viewBox="0 0 240 60" role="img" aria-label="Email">
<defs><linearGradient id="gb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="60" ><stop offset="0" stop-color="#2EE6F6"/><stop offset="0.55" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient></defs>
<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
