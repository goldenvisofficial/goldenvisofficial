<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="100" viewBox="0 0 1280 100" role="img" aria-label="Who we are">
<defs><clipPath id="frame"><rect width="1280" height="100" rx="18"/></clipPath><linearGradient id="gh" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="1220" y2="0" ><stop offset="0" stop-color="#2EE6F6"/><stop offset="0.55" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient></defs>
<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.flow{fill:none;stroke:url(#gh);stroke-width:3;stroke-linecap:round;stroke-dasharray:90 1100;stroke-dashoffset:1190;animation:flow 4.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:0}}
.via{animation:via 4.5s ease-in-out infinite}
@keyframes via{0%,70%,100%{stroke:#2B3A5C}80%{stroke:#2EE6F6}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="100" fill="#070B14"/>
  <text x="40" y="40" class="mono" font-size="13" fill="#2EE6F6" letter-spacing="4">01 — ABOUT</text>
  <text x="40" y="76" class="sans" font-size="28" font-weight="700" fill="#E9EEF7">Who we are</text>
  <path d="M420 56 H1100 L1120 36 H1200" fill="none" stroke="#1C2840" stroke-width="2" stroke-linejoin="round"/>
  <path class="flow" d="M420 56 H1100 L1120 36 H1200"/>
  <circle cx="420" cy="56" r="4" fill="url(#gh)"/>
  <circle class="via" cx="1208" cy="36" r="6" fill="#070B14" stroke="#2B3A5C" stroke-width="2.5"/>
  <g fill="#24324D"><rect x="1150" y="62" width="6" height="6" rx="1"/><rect x="1162" y="62" width="6" height="6" rx="1"/><rect x="1174" y="62" width="6" height="6" rx="1"/></g>
</g>
<rect x="0.5" y="0.5" width="1279" height="99" rx="18" fill="none" stroke="#1C2840"/>
</svg>