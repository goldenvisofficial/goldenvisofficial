<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.flow{fill:none;stroke:#2EE6F6;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:12 220;stroke-dashoffset:232;animation:flow 3s linear infinite}
@keyframes flow{to{stroke-dashoffset:0}}
.glow{transform-box:fill-box;transform-origin:center;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.blink{animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
.tag{animation:tag 4s ease-in-out infinite}
@keyframes tag{0%,100%{opacity:.75}15%{opacity:1}}

.pin{animation:pin 3.2s ease-in-out infinite;opacity:.35}
@keyframes pin{0%,100%{opacity:.35}12%{opacity:1}30%{opacity:.35}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 7s ease-in-out infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.06)}96%{transform:scaleY(1)}}
.scan{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{animation:core 2.4s ease-in-out infinite}
@keyframes core{0%,100%{opacity:1}50%{opacity:.5}}
.glint{transform-box:fill-box;transform-origin:center;animation:glint 3.5s ease-in-out infinite}
@keyframes glint{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.6}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
