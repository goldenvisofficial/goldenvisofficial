<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-label="Let&#39;s build what&#39;s next">
<defs>
  <clipPath id="frame"><rect width="1280" height="380" rx="24"/></clipPath>
  <linearGradient id="gm" gradientUnits="userSpaceOnUse" x1="30" y1="30" x2="170" y2="170" ><stop offset="0" stop-color="#2EE6F6"/><stop offset="0.55" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
  <linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="540" y1="50" x2="740" y2="250" ><stop offset="0" stop-color="#2EE6F6"/><stop offset="0.55" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient>
  <radialGradient id="glow" gradientUnits="userSpaceOnUse" cx="640" cy="150" r="300">
    <stop offset="0" stop-color="#3D7BFF" stop-opacity="0.25"/><stop offset="1" stop-color="#8A5CFF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#0F182A" stroke-width="1"/></pattern>
</defs>
<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.ring{fill:none;stroke:url(#gr);stroke-width:1.5;transform-box:fill-box;transform-origin:center;animation:ring 4.2s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.95);opacity:.7}100%{transform:scale(2.8);opacity:0}}

.pin{animation:pin 3.2s ease-in-out infinite;opacity:.35}
@keyframes pin{0%,100%{opacity:.35}12%{opacity:1}30%{opacity:.35}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 7s ease-in-out infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.06)}96%{transform:scaleY(1)}}
.scan{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.core{animation:core 2.4s ease-in-out infinite}
@keyframes core{0%,100%{opacity:1}50%{opacity:.5}}
.glint{transform-box:fill-box;transform-origin:center;animation:glint 3.5s ease-in-out infinite}
@keyframes glint{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.6}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="380" fill="#070B14"/>
  <rect width="1280" height="380" fill="url(#grid)"/>
  <circle cx="640" cy="150" r="300" fill="url(#glow)"/>
  <circle class="ring" cx="640" cy="150" r="95" style="animation-delay:-0s"/><circle class="ring" cx="640" cy="150" r="95" style="animation-delay:-1.4s"/><circle class="ring" cx="640" cy="150" r="95" style="animation-delay:-2.8s"/>
  <g transform="translate(550 60) scale(0.9)">
<g fill="none" stroke="url(#gm)" stroke-linecap="round">
  <g stroke-width="5"><path class="pin" d="M73 40 V24" style="animation-delay:-0.0s"/><path class="pin" d="M91 40 V24" style="animation-delay:-0.2s"/><path class="pin" d="M109 40 V24" style="animation-delay:-0.4s"/><path class="pin" d="M127 40 V24" style="animation-delay:-0.6s"/><path class="pin" d="M160 73 H176" style="animation-delay:-0.8s"/><path class="pin" d="M160 91 H176" style="animation-delay:-1.0s"/><path class="pin" d="M160 109 H176" style="animation-delay:-1.2s"/><path class="pin" d="M160 127 H176" style="animation-delay:-1.4s"/><path class="pin" d="M127 160 V176" style="animation-delay:-1.6s"/><path class="pin" d="M109 160 V176" style="animation-delay:-1.8s"/><path class="pin" d="M91 160 V176" style="animation-delay:-2.0s"/><path class="pin" d="M73 160 V176" style="animation-delay:-2.2s"/><path class="pin" d="M40 127 H24" style="animation-delay:-2.4s"/><path class="pin" d="M40 109 H24" style="animation-delay:-2.6s"/><path class="pin" d="M40 91 H24" style="animation-delay:-2.8s"/><path class="pin" d="M40 73 H24" style="animation-delay:-3.0s"/></g>
  <rect x="40" y="40" width="120" height="120" rx="18" stroke-width="5"/>
</g>
<circle cx="57" cy="57" r="3.5" fill="url(#gm)"/>
<g class="eye">
  <path d="M52 100 Q100 48 148 100 Q100 152 52 100 Z" fill="#070B14" fill-opacity="0.6" stroke="url(#gm)" stroke-width="4.5" stroke-linejoin="miter" stroke-miterlimit="12"/>
  <circle class="scan" cx="100" cy="100" r="25" fill="none" stroke="url(#gm)" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.7"/>
  <circle cx="100" cy="100" r="20" fill="none" stroke="url(#gm)" stroke-width="4"/>
  <rect class="core" x="93" y="93" width="14" height="14" rx="2.5" fill="url(#gm)"/>
  <circle class="glint" cx="109.5" cy="89.5" r="2.6" fill="#E6FBFF"/>
</g></g>
  <text x="640" y="296" text-anchor="middle" class="sans" font-size="36" font-weight="800" fill="#E9EEF7">Let&#39;s build what&#39;s next.</text>
  <text x="640" y="332" text-anchor="middle" class="sans" font-size="17" fill="#9FB0CC">Tell us what you&#39;re working on. We&#39;ll bring the engineering.</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="379" rx="24" fill="none" stroke="#1C2840"/>
</svg>