<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="290" viewBox="0 0 1280 290" role="img" aria-label="How we work: discover, design, build, secure, launch">
<defs><clipPath id="frame"><rect width="1280" height="290" rx="24"/></clipPath><linearGradient id="gp" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="1120" y2="0" ><stop offset="0" stop-color="#2EE6F6"/><stop offset="0.55" stop-color="#3D7BFF"/><stop offset="1" stop-color="#8A5CFF"/></linearGradient></defs>
<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.flow{fill:none;stroke:url(#gp);stroke-width:4;stroke-linecap:round;stroke-dasharray:60 1140;stroke-dashoffset:1200;animation:flow 6s linear infinite}
@keyframes flow{to{stroke-dashoffset:0}}
.ring{opacity:0;animation:on 6s ease-in-out infinite}
@keyframes on{0%,100%{opacity:0}4%,22%{opacity:1}32%{opacity:0}}
.halo{opacity:0;transform-box:fill-box;transform-origin:center;animation:halo 6s ease-out infinite}
@keyframes halo{0%{opacity:.8;transform:scale(1)}18%{opacity:0;transform:scale(1.6)}100%{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="290" fill="#070B14"/>
  <path d="M160 110 H1120" stroke="#1C2840" stroke-width="3"/>
  <path class="flow" d="M160 110 H1120"/>
  
<circle cx="160" cy="110" r="36" fill="#0C1322" stroke="#24324D" stroke-width="2"/>
<circle class="ring" cx="160" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="3" style="animation-delay:-0.0s"/>
<circle class="halo" cx="160" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="1.5" style="animation-delay:-0.0s"/>
<text x="160" y="116" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#E9EEF7">01</text>
<text x="160" y="190" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#E9EEF7">Discover</text>
<text x="160" y="216" text-anchor="middle" class="sans" font-size="14" fill="#9FB0CC">Goals, users, constraints</text>
<circle cx="400" cy="110" r="36" fill="#0C1322" stroke="#24324D" stroke-width="2"/>
<circle class="ring" cx="400" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="3" style="animation-delay:-1.2s"/>
<circle class="halo" cx="400" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="1.5" style="animation-delay:-1.2s"/>
<text x="400" y="116" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#E9EEF7">02</text>
<text x="400" y="190" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#E9EEF7">Design</text>
<text x="400" y="216" text-anchor="middle" class="sans" font-size="14" fill="#9FB0CC">Architecture &amp; UX</text>
<circle cx="640" cy="110" r="36" fill="#0C1322" stroke="#24324D" stroke-width="2"/>
<circle class="ring" cx="640" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="3" style="animation-delay:-2.4s"/>
<circle class="halo" cx="640" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="1.5" style="animation-delay:-2.4s"/>
<text x="640" y="116" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#E9EEF7">03</text>
<text x="640" y="190" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#E9EEF7">Build</text>
<text x="640" y="216" text-anchor="middle" class="sans" font-size="14" fill="#9FB0CC">Clean, tested code</text>
<circle cx="880" cy="110" r="36" fill="#0C1322" stroke="#24324D" stroke-width="2"/>
<circle class="ring" cx="880" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="3" style="animation-delay:-3.6s"/>
<circle class="halo" cx="880" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="1.5" style="animation-delay:-3.6s"/>
<text x="880" y="116" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#E9EEF7">04</text>
<text x="880" y="190" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#E9EEF7">Secure</text>
<text x="880" y="216" text-anchor="middle" class="sans" font-size="14" fill="#9FB0CC">Pentest &amp; hardening</text>
<circle cx="1120" cy="110" r="36" fill="#0C1322" stroke="#24324D" stroke-width="2"/>
<circle class="ring" cx="1120" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="3" style="animation-delay:-4.8s"/>
<circle class="halo" cx="1120" cy="110" r="36" fill="none" stroke="url(#gp)" stroke-width="1.5" style="animation-delay:-4.8s"/>
<text x="1120" y="116" text-anchor="middle" class="mono" font-size="17" font-weight="700" fill="#E9EEF7">05</text>
<text x="1120" y="190" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#E9EEF7">Launch</text>
<text x="1120" y="216" text-anchor="middle" class="sans" font-size="14" fill="#9FB0CC">Deploy, monitor, support</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="289" rx="24" fill="none" stroke="#1C2840"/>
